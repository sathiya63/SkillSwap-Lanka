{% extends 'base.html' %}{% block title %}Explore{% endblock %}{% block content %}<main class="shell page"><div class="page-head"><div class="eyebrow">EXPLORE THE COMMUNITY</div><h1>Discover <em>opportunities.</em></h1><p>Find skills, jobs and items worth connecting over.</p></div><form method="get" class="filters"><label><span>Search</span><input name="q" value="{{q}}" placeholder="Search opportunities..."></label><label><span>Category</span><select name="category"><option value="">All categories</option>{% for key,label in categories.items() %}<option value="{{key}}" {% if category==key %}selected{% endif %}>{{label}}</option>{% endfor %}</select></label><label><span>Area</span><input name="area" value="{{area}}" placeholder="e.g. Ragama"></label><button class="btn btn-primary" type="submit">Search ↗</button></form><div class="results-bar"><h2>{{posts|length}} results</h2><a class="text-link" href="{{url_for('new_post')}}">+ Create a post</a></div><div class="listings-grid">{% include '_cards.html' %}</div></main>{% endblock %}
